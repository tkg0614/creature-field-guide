# 素材の表を、無料枠のクラウドAIを順に使い回して下書きする（毎日の夜中・手動でも）。
# AI は data/providers.json の上から。上限に当たったら次の AI へ、休み明けにまた使う（data/cooldown.json に記録して引き継ぐ）。
# 鍵:  Settings → Secrets → Actions に入れたものだけ使う。
# 1つの機械で種を1つずつ順に（上限の記録を1か所で持つため）。使える AI が無くなったら、その回はおしまい。
name: draft sheets (cloud AI)
on:
  workflow_dispatch:
    inputs:
      ids: { description: "種の id（空白区切り。空なら queue のまだの種から）", required: false, default: "" }
      max: { description: "最大何種", required: false, default: "4" }
  schedule:
    - cron: "3 18 * * *"   # 毎日 日本の3:03（Gemini の無料枠は日本の16〜17時に戻り、夜中まで使わずに残っている）。5:00 に Claude が検品する
    - cron: "33 18 * * *"  # 控え 3:33（GitHub は定時の起動を落とすことがある。枠が無ければすぐ終わる）
    - cron: "3 19 * * *"   # 控え 4:03
permissions:
  contents: write
concurrency: { group: draft, cancel-in-progress: false }
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 下書きする（種ごとに commit・push）
        env: { IDS: "${{ inputs.ids }}", MAX: "${{ inputs.max || 4 }}" }
        run: |
          git config user.name "field-guide-bot"; git config user.email "field-guide-bot@users.noreply.github.com"
          node tools/selftest.js | tail -2 | grep -q '✓' || { echo '道具の手元試験に落ちた（AI を使う前に止める）'; exit 1; }
          node tools/ai.js --ping
          IDS=$(node -e '
            const fs=require("fs"), want=(process.env.IDS||"").split(/\s+/).filter(Boolean);
            const st=(id)=>{try{return JSON.parse(fs.readFileSync(`sheets/${id}.json`,"utf8")).status}catch{return "none"}};
            const q=JSON.parse(fs.readFileSync("data/queue.json","utf8")).map(x=>x.id);
            console.log((want.length?want:q.filter(id=>["none","draft"].includes(st(id)))).slice(0,+process.env.MAX).join(" "))')
          echo "今回: $IDS"
          for id in $IDS; do
            node tools/fetch.js "$id"
            set +e; node tools/draft.js "$id" --tries 4; code=$?; set -e
            node tools/check.js "$id" || true
            git add -A sheets sources data/cooldown.json data/models.json 2>/dev/null || true
            git diff --cached --quiet || { git commit -q -m "draft: $id"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done; }
            [ "$code" = 3 ] && { echo "使える AI が無くなったので、続きは次の回"; break; }
          done
