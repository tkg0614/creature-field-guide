# 素材の表を、クラウドのAI（GitHub Models: Actions の GITHUB_TOKEN だけで使える・鍵の登録なし）で下書きする。
# 手動だけ。種ごとに別の機械で同時に回す。モデルや回数の上限は GitHub Models の無料枠に従う。
name: draft sheets (cloud AI)
on:
  workflow_dispatch:
    inputs:
      ids: { description: "種の id（空白区切り）", required: true, default: "snake" }
      model: { description: "モデル（GitHub Models の名前）", required: false, default: "openai/gpt-4.1" }
permissions:
  contents: write
  models: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { ids: "${{ steps.p.outputs.ids }}" }
    steps:
      - id: p
        run: node -e 'const ids=process.env.IDS.split(/\s+/).filter(Boolean); require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`ids=${JSON.stringify(ids)}\n`)'
        env: { IDS: "${{ inputs.ids }}" }
  draft:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: { id: "${{ fromJson(needs.plan.outputs.ids) }}" }
    steps:
      - uses: actions/checkout@v4
      - name: 資料を取ってきて下書きする
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PROVIDER: github, MODEL: "${{ inputs.model }}" }
        run: |
          node tools/fetch.js ${{ matrix.id }}
          rm -f sheets/${{ matrix.id }}.json
          node tools/draft.js ${{ matrix.id }} --tries 4 || true
          node tools/check.js ${{ matrix.id }} || true
      - name: 送る
        run: |
          git config user.name "field-guide-bot"; git config user.email "field-guide-bot@users.noreply.github.com"
          git add sheets/${{ matrix.id }}.json sources/${{ matrix.id }}
          git diff --cached --quiet && exit 0
          git commit -q -m "draft: ${{ matrix.id }}（GitHub Models ${{ inputs.model }}）"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep $((i*7)); done
